name: node.js CI
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use node.js
        uses: actions/setup-node@v4
        with:
          node-verion: "20" 

      - name: Install dependencies
        run: npm 
        
      - name: Run Tets
        run: npm test