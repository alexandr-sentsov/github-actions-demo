name: node.js CI
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout

      - name: Use node.js
        uses: actions/setup-node
        with:
          node-version: "24" 

      - name: Install dependencies
        run: npm install
        
      - name: Run Tets
        run: npm test